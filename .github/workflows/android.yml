
name: Build Avalonia Fishing Auto APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AvaloniaFishingAuto_AndroidStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o AvaloniaFishingAuto_AndroidStudio.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AvaloniaFishingAuto/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: AvaloniaFishingAuto
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-Fishing-Auto-APK
          path: AvaloniaFishingAuto/app/build/outputs/apk/debug/app-debug.apk
