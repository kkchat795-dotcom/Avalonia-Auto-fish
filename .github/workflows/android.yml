
name: Build Avalonia Fishing Auto APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AvaloniaFishingAuto_AndroidStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip AvaloniaFishingAuto_AndroidStudio.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AvaloniaFishingAuto
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-Fishing-Auto-APK
          path: AvaloniaFishingAuto/app/build/outputs/apk/debug/app-debug.apk
          
